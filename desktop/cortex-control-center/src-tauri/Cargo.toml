[package]
name = "cortex-control-center"
version = "0.6.0"
description = "Native desktop control center for Cortex"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "7.0.0"
fs2 = "0.4.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-updater = "2.11.0"
toml = "1.1.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[workspace]
