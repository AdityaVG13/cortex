[package]
name = "cortex-control-center"
version = "0.6.0"
description = "Native desktop control center for Cortex"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
dirs = "6.0.0"
fs2 = "0.4.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-updater = "2.10.1"
toml = "1.1.2"
