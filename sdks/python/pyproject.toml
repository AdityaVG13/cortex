[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-memory"
version = "0.6.0"
description = "Python SDK for the Cortex AI Memory daemon"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=8.4.2", "pytest-httpx>=0.35.0"]
