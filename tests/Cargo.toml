[package]
name = "cortex-tests"
version = "0.6.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
cortex-daemon = { path = "../crates/daemon" }
cortex-kernel = { path = "../crates/kernel" }
cortex-logic = { path = "../crates/logic" }
asupersync = "0.4.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27"
proptest = "1"
serde = { version = "1.0.229", features = ["derive"] }
