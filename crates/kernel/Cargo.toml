[package]
name = "cortex-kernel"
version = "0.6.0"
edition = "2024"
description = "Cortex embeddable brain — in-process store/recall/boot over SQLite, no server"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
cortex-logic = { path = "../logic" }
chrono = { version = "0.4.45", features = ["serde", "clock"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
flate2 = "1"
toml = "1.1.5"
asupersync = "=0.4.10"
fsqlite = { version = "0.3.18", optional = true }
frankensearch = { version = "0.4.3", optional = true }
hnswlib-rs = { version = "0.10.0", optional = true }
toon-rust = { version = "0.1.3", optional = true }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
argon2 = "0.6.0"
fs2 = "0.4.3"
sha2 = "0.11.0"
dirs = "7.0.0"
sysinfo = "0.39.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[features]
default = []
fsqlite-store = ["dep:fsqlite"]
hybrid-search = ["dep:frankensearch"]
vector-search = ["dep:hnswlib-rs", "dep:frankensearch"]
toon-payloads = ["dep:toon-rust"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
