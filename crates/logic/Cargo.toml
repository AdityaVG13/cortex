[package]
name = "cortex-logic"
version = "0.6.0"
edition = "2021"
description = "Deterministic domain logic for Cortex"
license = "MIT"

[dependencies]
chrono = { version = "0.4.44", features = ["serde", "clock"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["sync", "time"] }
toml = "1.1.2"

[lints.rust]
unsafe_code = "forbid"
