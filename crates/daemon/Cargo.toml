[package]
name = "cortex-daemon"
version = "0.6.0"
edition = "2024"
description = "Cortex memory daemon — standalone Rust binary"
license = "MIT"

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-logic = { path = "../logic" }
cortex-kernel = { path = "../kernel" }
asupersync = "=0.4.10"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
futures-util = "0.3.34"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
flate2 = "1"
toml = "1.1.5"

uuid = { version = "1.26.0", features = ["v4", "serde"] }
argon2 = "0.6.0"
fs2 = "0.4.3"
sha2 = "0.11.0"


dirs = "7.0.0"
sysinfo = "0.39.6"


# Platform file-permission support
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false
