[package]
name = "cortex-tests"
version = "0.6.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
cortex-daemon = { path = "../cortex-daemon" }
rusqlite = { version = "0.39.0", features = ["bundled"] }
tempfile = "3.27"
proptest = "1"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# The migrated external integration tests (adapter_conformance, cli_goldens,
# mcp_rpc_headers, mcp_transport) only need std + serde_json + the support
# harness; the curated contracts add nothing beyond the above.
