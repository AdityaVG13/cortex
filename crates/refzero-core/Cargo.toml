[package]
name = "cortex-refzero"
version = "0.6.0"
edition = "2024"
description = "Cortex identity store: RefZero-compatible interned objects and captured-use locs over rusqlite"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = "1.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
